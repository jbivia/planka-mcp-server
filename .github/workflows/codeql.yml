name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Une passe hebdomadaire : les regles de CodeQL evoluent, un code inchange
    # peut devenir signale sans qu'aucun commit ne declenche l'analyse.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyse TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Requis pour publier les alertes dans l'onglet Security.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          # security-extended ajoute les requetes a plus faible confiance :
          # sur un depot de 3000 lignes le bruit reste gerable, et c'est la ou
          # se trouvent les injections de chemin et les fuites de secret.
          queries: security-extended

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"
